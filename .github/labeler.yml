# PR auto-labeling by changed path → drives ship-next surface classification
# and surfaces the money path on every PR. Applied by .github/workflows/labeler.yml
# (actions/labeler@v5, additive). The labels themselves live in .github/labels.yml.
# See docs/contributing/ship-playbooks/README.md.

"area:frontend":
  - changed-files:
      - any-glob-to-any-file: "packages/frontend/**"

"area:backend":
  - changed-files:
      - any-glob-to-any-file: "packages/backend/**"

"area:sdk":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/sdk/**"
          - "packages/connect/**"
          - "packages/cli/**"

"area:mcp":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/mcp/**"
          - "packages/mcp-server/**"
          - "packages/signer/**"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

# GENERATED-ADJACENT: this list must equal the UNION of `globs` and
# `controlGlobs` in .github/money-path-globs.json, the single source of truth
# (#1030). scripts/ci/money-path.test.mjs fails CI if they diverge.
#
# It used to claim to mirror the SKILL.md Merge Gate and silently did not --
# the delegation rail, the rail seam and the SDK signer were all missing, so
# money-path PRs on those files never got the label and never loaded money.md.
#
# `controlGlobs` are the money-path SAFEGUARD itself (the QA freshness gate and
# its config). They are labelled here so a PR weakening the gate gets the
# playbook and a human, but they are excluded from the freshness check itself --
# re-running the money-flow harness proves nothing about a CI config change.
"money-path":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/CODEOWNERS"
          - ".github/money-path-globs.json"
          - ".github/workflows/dev-gate.yml"
          - ".github/workflows/publish.yml"
          - ".github/workflows/qa-dev.yml"
          - "packages/backend/src/db/migrations/**"
          - "packages/backend/src/domain/machine-payment-lifecycle.ts"
          - "packages/backend/src/domain/payment-token.ts"
          - "packages/backend/src/infra/chain/**"
          - "packages/backend/src/infra/delegate-*.ts"
          - "packages/backend/src/infra/outbound-*.ts"
          - "packages/backend/src/infra/relayer*.ts"
          - "packages/backend/src/infra/repositories/**"
          - "packages/backend/src/middleware/agentAuth.ts"
          - "packages/backend/src/modules/accounts/mainnet-gate.ts"
          - "packages/backend/src/modules/agents/rekey-*.ts"
          - "packages/backend/src/modules/mpp/**"
          - "packages/backend/src/modules/x402/**"
          - "packages/backend/src/rails/allowance-module.ts"
          - "packages/backend/src/rails/delegation-*.ts"
          - "packages/backend/src/rails/execution-rail.ts"
          - "packages/backend/src/rails/hybrid-account-config.ts"
          - "packages/backend/src/rails/hybrid-provisioning.ts"
          - "packages/backend/src/rails/hybrid-signer-actions.ts"
          - "packages/backend/src/rails/hybrid-transfers.ts"
          - "packages/backend/src/rails/sweep.ts"
          - "packages/backend/src/routes/agent-delegations.ts"
          - "packages/backend/src/routes/agent-rekey.ts"
          - "packages/backend/src/routes/approvals.ts"
          - "packages/backend/src/routes/hybrid-accounts.ts"
          - "packages/backend/src/routes/machine-payments.ts"
          - "packages/backend/src/routes/payments.ts"
          - "packages/backend/src/routes/safe-exec.ts"
          - "packages/backend/src/routes/x402-resources.ts"
          - "packages/backend/src/routes/x402.ts"
          - "packages/sdk/src/signer.ts"
          - "scripts/ci/money-path-restatement-scan.mjs"
          - "scripts/ci/money-path.test.mjs"
          - "scripts/ci/qa-freshness.mjs"
          - "scripts/release-bump.mjs"
