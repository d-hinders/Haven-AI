# PR auto-labeling by changed path → drives ship-next surface classification
# and surfaces the money path on every PR. Applied by .github/workflows/labeler.yml
# (actions/labeler@v5, additive). The labels themselves live in .github/labels.yml.
# See docs/contributing/ship-playbooks/README.md.

"area:frontend":
  - changed-files:
      - any-glob-to-any-file: "packages/frontend/**"

"area:backend":
  - changed-files:
      - any-glob-to-any-file: "packages/backend/**"

"area:sdk":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/sdk/**"
          - "packages/connect/**"
          - "packages/cli/**"

"area:mcp":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/mcp/**"
          - "packages/mcp-server/**"
          - "packages/signer/**"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

# GENERATED-ADJACENT: this list must equal .github/money-path-globs.json,
# which is the single source of truth (#1030). scripts/ci/money-path.test.mjs
# fails CI if they diverge. It used to claim to mirror the SKILL.md Merge Gate
# and silently did not — the delegation rail, the rail seam and the SDK signer
# were all missing, so money-path PRs on those files never got the label and
# never loaded money.md.
"money-path":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/backend/src/routes/x402.ts"
          - "packages/backend/src/routes/x402-resources.ts"
          - "packages/backend/src/routes/payments.ts"
          - "packages/backend/src/routes/machine-payments.ts"
          - "packages/backend/src/routes/agent-delegations.ts"
          - "packages/backend/src/lib/machine-payments.ts"
          - "packages/backend/src/lib/payment-coverage.ts"
          - "packages/backend/src/lib/allowance-module.ts"
          - "packages/backend/src/lib/execution-rail.ts"
          - "packages/backend/src/lib/delegation-*.ts"
          - "packages/backend/src/lib/hybrid-provisioning.ts"
          - "packages/backend/src/lib/hybrid-account-config.ts"
          - "packages/backend/src/middleware/agentAuth.ts"
          - "packages/backend/src/db/migrations/**"
          - "packages/sdk/src/signer.ts"
          - "scripts/release-bump.mjs"
          - ".github/workflows/publish.yml"
