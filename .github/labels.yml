# Surface labels for ship-next classification (epic #651).
# Synced to the repo by .github/workflows/labels.yml on merge to dev/main.
# `skip-delete: true` there means labels NOT listed here (epic, code-quality, …)
# are left untouched — this file owns only the surface taxonomy below.
#
# These drive the skill's Phase 1.5 routing — see
# docs/contributing/ship-playbooks/README.md.

- name: "area:frontend"
  color: "1d76db"
  description: "Touches packages/frontend UI — loads the frontend playbook (UX + design system)"

- name: "area:backend"
  color: "0e8a16"
  description: "Touches packages/backend routes/services/API"

- name: "area:sdk"
  color: "5319e7"
  description: "SDK / connect / API contract / credential surfaces"

- name: "area:mcp"
  color: "fbca04"
  description: "MCP server, signer, or hosted-MCP surfaces"

- name: "area:docs"
  color: "0052cc"
  description: "Documentation-only change"

- name: "money-path"
  color: "b60205"
  description: "Payments, agent authority, allowances, or migrations — loads money.md (characterization tests + CASP)"

- name: "promotion"
  color: "1d76db"
  description: "Tracks dev → prod promotion (used by the pending-promotion digest)"

# Not a surface label: a MERGE-TIME control. `Closes #<n>` is a GitHub keyword
# that closes the issue on merge whatever the pull-request body says elsewhere,
# so ship-next's operator-verify mode — "the code lands, the issue stays open
# until a human runs the live step" — was unenforceable in prose and lost the
# first time it was used (#2268, closed by the merge of PR #2272). This label is
# the machine-readable form of that declaration:
# `scripts/ci/operator-verify-close-guard.mjs` fails a pull request whose closing
# keyword targets an issue carrying it. Remove it when the operator step is done.
- name: "operator-verify"
  color: "d93f0b"
  description: "Issue must outlive the merge — a human operator step is still outstanding; PRs must use `Refs #<n>`, not `Closes`"
