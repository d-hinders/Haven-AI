name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # #1768: the `ui_suite` choice input is gone. Its only purpose was to select
  # between the desktop-only browser suite and "desktop + mobile"; both
  # projects now gate on every pull request, so the input selected between a
  # thing and itself — a control that looks like it widens coverage while
  # doing nothing is the same defect this issue closed one layer up.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      sdk: ${{ steps.filter.outputs.sdk }}
      connect: ${{ steps.filter.outputs.connect }}
      mcp: ${{ steps.filter.outputs.mcp }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      signer: ${{ steps.filter.outputs.signer }}
      cli: ${{ steps.filter.outputs.cli }}
      full: ${{ steps.filter.outputs.full }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The routing program itself lives in scripts/ci/change-classifier.mjs and is
      # tested by scripts/ci/change-classifier.test.mjs (#1622). It was 164 lines of
      # inline shell here, where no test could reach it — which is how #1206 left a
      # suite running nowhere and #1030 left a money-path safeguard wrong. Keep this
      # step a bare invocation: rules belong in the script, where they are covered.
      - name: Classify changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/change-classifier.mjs

  # Unconditional by design (#1030). These tests cover repo-level CI config —
  # the money-path glob list and the money-flow QA freshness gate that replaced
  # the in-session money-path approval pause (#1024). They must run on EVERY PR,
  # not behind a surface filter: the whole failure being fixed is a money-path
  # safeguard that nobody noticed was wrong. Dependency-free, ~1s, no npm ci.
  ci_config_checks:
    name: Repo CI config checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Money-path list + QA freshness gate
        run: node --test scripts/ci/*.test.mjs
      # #1206: this suite previously ran NOWHERE — it lives outside every
      # test glob. Dependency-free like the step above, so it belongs here.
      - name: Dist-freshness guard self-test
        run: node --test scripts/check-dist-freshness.test.mjs

      # #1526: internal @haven_ai/* ranges must match how the consuming package
      # RESOLVES them — published packages pin a concrete version, private
      # workspace consumers use "*". Belongs on EVERY PR for the same reason as
      # the steps above: any package.json in the tree can break it, and the
      # failure mode is silent (npm ci installs a stale registry tarball while
      # CI stays green against the workspace build). Dependency-free, no npm ci.
      # Self-tested — a lint nobody tests can start passing vacuously.
      - name: Workspace pin lint
        run: |
          node scripts/workspace-pin-lint.mjs
          node --test scripts/workspace-pin-lint.test.mjs

      # #1500: the branch-hygiene report is NOT run in CI — it reports on
      # `dev`'s history, not on this PR, and the contributor whose PR it would
      # block is never the one who can change how sessions are launched. Only
      # its self-test runs here, for the reason every other lint on this job
      # is self-tested: a report nobody tests can start answering "clean"
      # vacuously, which is worse than no report. Run the report itself with
      # `npm run branch-hygiene`.
      - name: Branch-hygiene report self-test
        run: node --test scripts/branch-hygiene.test.mjs

      # #1663: the release-bump lockfile logic is self-tested here for the
      # same reason. The bump itself runs on a release-cutter's machine, not
      # in CI — but its guard is what stands between npm's lockfile churn and
      # a release diff that must be nothing but version strings, and a guard
      # nobody tests can start passing vacuously.
      - name: Release-bump lockfile self-test
        run: node --test scripts/release-bump.test.mjs

  sdk_checks:
    name: SDK checks
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Network-map pins (#1478)
        run: npm run lint:network-pins

      - name: Type-check SDK
        run: npm run typecheck -w packages/sdk

      - name: Run SDK unit tests
        run: npm run test -w packages/sdk

      - name: Build SDK
        run: npm run build -w packages/sdk

  cli_checks:
    name: CLI checks
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check CLI
        run: npm run typecheck -w packages/cli

      - name: Run CLI unit tests
        run: npm run test -w packages/cli

      - name: Build CLI
        run: npm run build -w packages/cli

  backend_checks:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: haven
          POSTGRES_DB: haven
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://haven:haven@localhost:5432/haven
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Network-map pins (#1478)
        run: npm run lint:network-pins

      - name: Type-check backend
        run: npm run typecheck -w packages/backend

      - name: Dependency-boundary lint (#982)
        # Blocking, shrink-only ratchet over the module-boundary rules in
        # docs/architecture/10-module-boundaries.md. Runs early — it takes ~2s
        # and a boundary break should fail before the slower suites. The unit
        # tests run alongside it because a gate that cannot fire is worse than
        # no gate (the chain-SDK rule silently passed during development).
        run: |
          npm run lint:deps
          npm run lint:deps:test

      - name: DB-mock ratchet (#1227)
        # Blocking, shrink-only baseline over positional DB mocking
        # (vi.mock('db.js') + mockResolvedValueOnce counts). Database
        # behaviour belongs in repository tests on the real-Postgres harness
        # (#1220); this stops the mock pattern growing back. Self-tested for
        # the same reason as lint:deps above.
        run: |
          npm run lint:db-mocks
          npm run lint:db-mocks:test

      - name: DB schema smoke (migrations + money-path query PREPARE, #773)
        # Applies every migration to the real Postgres service, then PREPAREs the
        # curated money-path queries so column/type drift fails here instead of
        # in dev. Mocked route tests never validate SQL against the schema —
        # this is how the agents.safe_address join reached dev (#757).
        run: npm run db:schema-smoke -w packages/backend

      - name: OpenAPI drift check
        # Surfaces the openapi spec drift assertions as a named step so a
        # failure is immediately visible in the workflow summary. The same
        # assertions also run as part of the full backend test suite below;
        # this step exists to make drift failures unambiguous on the GitHub
        # PR check list without scanning a 100+ line test output.
        run: npm run test -w packages/backend -- src/openapi/spec.test.ts

      - name: Generated api-types drift check (#984)
        # Blocking: packages/core/src/api-types.ts is generated from the
        # OpenAPI spec and committed; editing the spec without regenerating
        # fails here. Fix with `npm run generate:api-types`.
        run: npm run check:api-types

      - name: Run backend unit tests
        run: npm run test -w packages/backend

      - name: Build backend
        run: npm run build -w packages/backend

  mcp_checks:
    name: MCP checks
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check MCP
        run: npm run typecheck -w packages/mcp

      - name: Run MCP unit tests
        run: npm run test -w packages/mcp

      - name: Build MCP
        run: npm run build -w packages/mcp

  connect_checks:
    name: Connect checks
    needs: changes
    if: needs.changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check connector
        run: npm run typecheck -w packages/connect

      - name: Run connector unit tests
        run: npm run test -w packages/connect

      - name: Build connector
        run: npm run build -w packages/connect

  install_smoke:
    name: Install-path smoke
    needs: changes
    # Runs whenever connect changes — which, by the dependency table, already
    # includes every sdk and mcp change, because connect bundles both. This
    # used to spell out `connect || mcp || sdk`, re-stating in the workflow a
    # fan-out the classifier already computes (#1625). The two are equivalent
    # for every input; the OR just had a second, hand-maintained copy of the
    # dependency graph in it. Those are the packages that get packed and
    # installed, and any of them can introduce the class of bug the smoke
    # catches (stale MCP_VERSION, nested SDK resolution, broken wire-format
    # signing).
    if: needs.changes.outputs.connect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (required by MCP build step inside smoke:pack)
        run: npm run build -w packages/sdk

      - name: Build MCP (packs the up-to-date dist into the tarball)
        run: npm run build -w packages/mcp

      - name: Run install-path smoke tests
        # HAVEN_CONNECT_PACKAGE_SMOKE=1 enables the describeSmoke block.
        # smoke:pack also rebuilds sdk + mcp + signer before running so the
        # tarballs contain fresh dist output — belt and suspenders.
        run: npm run smoke:pack -w packages/connect

  mcp_server_checks:
    name: MCP server checks
    needs: changes
    if: needs.changes.outputs.mcp_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check MCP server
        run: npm run typecheck -w packages/mcp-server

      - name: Run MCP server unit tests
        run: npm run test -w packages/mcp-server

      - name: Build MCP server
        run: npm run build -w packages/mcp-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (MCP server) — catches a broken Dockerfile before deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp-server/Dockerfile
          push: false
          load: false
          tags: haven-mcp-server:ci

  signer_checks:
    name: Signer checks
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Network-map pins (#1478)
        run: npm run lint:network-pins

      - name: Type-check signer
        run: npm run typecheck -w packages/signer

      - name: Run signer unit tests
        run: npm run test -w packages/signer

      - name: Build signer
        run: npm run build -w packages/signer

  frontend_checks:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck -w packages/frontend

      - name: Design-system drift gate
        run: npm run design:lint -w packages/frontend

      - name: Wire-type ratchet (#1447)
        run: |
          npm run lint:wire-types
          npm run lint:wire-types:test

      - name: Run frontend unit tests
        run: npm run test -w packages/frontend

      - name: Build frontend
        run: npm run build -w packages/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: |
            packages/frontend/.next/standalone
            packages/frontend/.next/static
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  browser_smoke:
    name: Frontend browser smoke
    needs: [changes, frontend_checks]
    if: always() && needs.changes.outputs.frontend == 'true' && needs.frontend_checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-next-build
          path: packages/frontend/.next

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # #1609: only a cache MISS runs the install, and only the install runs
      # apt-get (--with-deps). On a warm cache no apt process starts at all —
      # the Azure apt-mirror Ign-loop (four blocked required-check runs on
      # 2026-08-19 alone) cannot touch this job then. The cache key pins the
      # browser build to package-lock.json, so a Playwright bump still
      # reinstalls (and re-baselines deliberately, never as a side effect).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      # #1768: BOTH Playwright projects gate here, unconditionally — desktop
      # (Desktop Chrome) and mobile (Pixel 5 device emulation). This step used
      # to run `test:e2e:desktop` only, with `chromium-mobile` reachable solely
      # via a `workflow_dispatch` with `ui_suite=full`. That meant no mobile
      # viewport was exercised on any pull request, while a configured project
      # made it look like one was — which is how #1749 shipped a primary
      # navigation that could not be opened below `lg`.
      #
      # The projects run disjoint spec sets (`*.mobile.spec.ts` → mobile,
      # everything else → desktop), so this is one browser project more, not
      # the whole suite twice; the reasoning lives in `playwright.config.ts`
      # next to the `testMatch`/`testIgnore` that implement it. One command,
      # not two steps, so a single Next server boot serves both projects.
      - name: Run frontend browser smoke tests (desktop + mobile)
        run: npm run test:e2e:gate -w packages/frontend
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            output/playwright/test-results
            output/playwright/html-report
          if-no-files-found: ignore

  design_visual:
    name: Design visual regression
    needs: [changes, frontend_checks]
    if: always() && needs.changes.outputs.frontend == 'true' && needs.frontend_checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-next-build
          path: packages/frontend/.next

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # #1609: only a cache MISS runs the install, and only the install runs
      # apt-get (--with-deps). On a warm cache no apt process starts at all —
      # the Azure apt-mirror Ign-loop (four blocked required-check runs on
      # 2026-08-19 alone) cannot touch this job then. The cache key pins the
      # browser build to package-lock.json, so a Playwright bump still
      # reinstalls (and re-baselines deliberately, never as a side effect).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      # Blocking visual guard (#897): /design-system pixel-compared against
      # committed Linux baselines. Intended changes: regenerate via the
      # "Update visual baselines" workflow (workflow_dispatch on the branch).
      - name: Visual regression — /design-system
        run: npm run test:visual -w packages/frontend
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: output/playwright/test-results
          retention-days: 7

  ci:
    name: Lint, Type-check & Build
    needs: [changes, sdk_checks, cli_checks, backend_checks, mcp_checks, connect_checks, install_smoke, mcp_server_checks, signer_checks, frontend_checks, ci_config_checks]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summarize required CI status
        run: |
          set -euo pipefail

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          # Checked BEFORE the docs-only early exit below: these cover the
          # money-path glob list and the money-flow QA gate (#1030), which are
          # repo config, not a code surface. A docs-only PR can absolutely break
          # them — and short-circuiting past them is how a money-path safeguard
          # goes unnoticed, which is the failure #1030 exists to close.
          if [ "${{ needs.ci_config_checks.result }}" != "success" ]; then
            echo "Repo CI config checks result: ${{ needs.ci_config_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "No code-impacting files changed; required CI passed without running heavy checks."
            exit 0
          fi

          if [ "${{ needs.changes.outputs.sdk }}" = "true" ] && [ "${{ needs.sdk_checks.result }}" != "success" ]; then
            echo "SDK checks result: ${{ needs.sdk_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.backend }}" = "true" ] && [ "${{ needs.backend_checks.result }}" != "success" ]; then
            echo "Backend checks result: ${{ needs.backend_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.mcp }}" = "true" ] && [ "${{ needs.mcp_checks.result }}" != "success" ]; then
            echo "MCP checks result: ${{ needs.mcp_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.connect }}" = "true" ] && [ "${{ needs.connect_checks.result }}" != "success" ]; then
            echo "Connect checks result: ${{ needs.connect_checks.result }}"
            exit 1
          fi

          # Gated on `connect` alone, matching install_smoke's own `if:`. This
          # was a `connect || mcp || sdk` OR — a THIRD copy of a fan-out the
          # dependency table already encodes, and the one that survived #1625's
          # first pass because it hides in a run: block where a job-gate scan
          # cannot see it. connect is true whenever sdk or mcp is.
          if [ "${{ needs.changes.outputs.connect }}" = "true" ] && [ "${{ needs.install_smoke.result }}" != "success" ]; then
            echo "Install-path smoke result: ${{ needs.install_smoke.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.mcp_server }}" = "true" ] && [ "${{ needs.mcp_server_checks.result }}" != "success" ]; then
            echo "MCP server checks result: ${{ needs.mcp_server_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.signer }}" = "true" ] && [ "${{ needs.signer_checks.result }}" != "success" ]; then
            echo "Signer checks result: ${{ needs.signer_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.cli }}" = "true" ] && [ "${{ needs.cli_checks.result }}" != "success" ]; then
            echo "CLI checks result: ${{ needs.cli_checks.result }}"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ] && [ "${{ needs.frontend_checks.result }}" != "success" ]; then
            echo "Frontend checks result: ${{ needs.frontend_checks.result }}"
            exit 1
          fi

          echo "Required package checks passed. Browser smoke, when applicable, runs as a separate check."
