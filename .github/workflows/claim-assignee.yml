name: Claim to assignee

# Keeps GitHub's assignee field in step with the claim protocol in AGENTS.md
# § Cross-session agent coordination — the ONLY canonical text of the protocol
# (#3182); this header explains this workflow's design and restates no rule of
# it. A `🔒 CLAIM #n` comment assigns its author
# to #n — unless another session holds a live claim on it, in which case it is
# refused with a reply, or a stale one, which is taken over (#3178, below); a
# `🔓 RELEASE #n` (or `↩️ WITHDRAWN #n`, #3182) unassigns them (the
# merge-time release, #3177, is posted and applied by
# `claim-release-on-merge.yml` itself — see below).
#
# ## Why the field is a projection and not the protocol
#
# The claim comment stays authoritative because it carries what an assignee
# structurally cannot: the BRANCH, which exists long before a PR, and
# `touches:`, which is file-level. File-level is what catches a collision
# between two DIFFERENT issues — the #2968/#2970 overlap on 2026-09-14 was two
# owners writing the same `paid-mcp-completion.ts`, and no assignee field can
# express that, because both issues were correctly owned.
#
# What the field adds is cheapness. It is one queryable value that every GitHub
# view and every tool can read without parsing a ~1,400-comment thread. The
# morning report got #2947 wrong on 2026-09-15 precisely because reading
# ownership properly took three API calls that nobody had told it to make.
#
# Maintaining that index by hand would mean two records drifting apart, so it is
# maintained by machine at the two moments the protocol already has.
#
# ## Only collaborators, because this repository is public
#
# `issue_comment` fires for anyone who can comment. Without the association
# gate a stranger could post `🔓 RELEASE #2947` and unassign live work, or claim
# an issue to look like its owner. GitHub would silently drop an assignment to a
# non-collaborator, but the UNassign path needs no permissions at all, so the
# gate is what closes it.
#
# `COLLABORATOR` on a user-owned repo includes read- and triage-level
# collaborators, who cannot assign through the UI but can through this workflow
# — to themselves only, on an issue they claimed in the open. Acceptable for
# this repo's membership, and stated so it is a decision rather than an
# oversight.
#
# ## The merge-time release does not pass through here (#3177)
#
# `claim-release-on-merge.yml` posts `🔓 RELEASE` as `github-actions[bot]` when
# a PR that closes the issue merges, and unassigns everyone on the issue
# ITSELF (`scripts/ci/release-on-merge.mjs`). That comment never re-enters this
# workflow: a comment posted with `GITHUB_TOKEN` does not trigger
# `issue_comment` (GitHub's non-recursion rule), and the Bot gate below keeps
# every bot out regardless. The parser still carries a `--author-type Bot`
# grammar — a bot may only release, and only in a line naming its PR — so that
# if this gate is ever opened to an App-token poster the narrowing is already
# the contract; today nothing depends on it, and the author type is passed
# with `User` as the default so an empty field never widens the grammar.
#
# ## A second claim on a held issue is answered (#3178)
#
# The #3005 collision (2026-09-15) was two claims 76 minutes apart on one
# issue; the projection added the second assignee without a word. Now a claim
# is projected through `scripts/ci/claim-collision.mjs`: if another session
# holds a LIVE claim (its last comment about the issue < 24 h ago, no RELEASE
# since — the rule AGENTS.md states), the claim is refused and a reply says who
# holds it, how old the claim is, when they were last active on it if they have
# commented since, and where to coordinate; a STALE claim (no activity for 24 h,
# unreleased) is taken over
# — holder unassigned, claimant assigned, reply says so; everything else
# (nobody else, same author, released, or an assignee with no claim comment) is
# accepted as before. Holders are found from the CLAIM COMMENTS (issue thread +
# the whole channel), not from the assignee field, so two claims seconds apart
# and a non-assignable author are both caught (a dead heat is resolved by age:
# the older HOLD wins — first claim in force — the newer run is the one refused) — and only a collaborator's, and a
# person's (`author_association` in this gate's set, `user.type` not `Bot`), so
# a drive-by claim on the public channel cannot refuse real ones. The reply is
# the only kind of
# comment this workflow writes, and it is shaped so the parser reads no marker
# from it. The `node` call is guarded like every `gh` call: a failure leaves the
# field alone and the loop continues to the next number.
#
# Never fails the build: a comment that parses to nothing is the common case,
# and an API refusal is logged, not raised. This workflow adds or removes an
# assignee and posts the one collision reply above — it never closes, labels or
# edits a body.

on:
  issue_comment:
    # `created` only. An `edited` trigger re-fires with the comment's ORIGINAL
    # body and author, so editing a two-month-old claim would re-apply it long
    # after its release — a replay with no upside, since a mistyped claim is
    # fixed by posting a corrected one, which the protocol expects anyway.
    types: [created]

permissions:
  issues: write # assign/unassign, and the one collision reply (#3178)

# No `concurrency` group, deliberately. Keying on the commented-on issue would
# not serialise what matters — most claims are posted on the channel ABOUT
# another issue, so a claim of #2947 from the channel and a release of #2947 posted on #2947
# land in different groups anyway. Worse, a group makes this less safe at 15+
# fires a day: GitHub cancels a PENDING run when a newer one queues, so a burst
# on the channel can drop the middle one, and a dropped 🔓 RELEASE is a permanently
# stale assignee. Both operations are idempotent and scoped to the comment
# author, so running them in parallel is safe.

jobs:
  project:
    name: Project the claim onto the assignee field
    # Collaborators only, and never on a pull request's comment thread.
    if: >-
      github.repository == 'd-hinders/Haven-AI' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Parse the comment and apply
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never interpolated into the script: the body is arbitrary
          # text from a public repository's comment box.
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          ON_ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          printf '%s' "$COMMENT_BODY" > comment.txt
          node scripts/ci/claim-assignee.mjs --body comment.txt --on-issue "$ON_ISSUE" --author-type "${COMMENT_AUTHOR_TYPE:-User}" > actions.txt

          if [ ! -s actions.txt ]; then
            echo "No claim or release in this comment — nothing to do."
            exit 0
          fi

          echo "Parsed:" && cat actions.txt

          while IFS='=' read -r verb number; do
            [ -n "${number:-}" ] || continue

            # The parser only ever emits digits, but this loop feeds a public
            # comment box into `gh` argv, so the guarantee is re-stated where it
            # is relied on rather than trusted from another file.
            case "$number" in
              ''|*[!0-9]*) echo "  skip malformed '$verb=$number'"; continue ;;
            esac

            case "$verb" in
              claim)
                # Decided and applied by claim-collision.mjs (#3178): skip on a
                # closed issue, accept, refuse with a reply, or take over a stale
                # claim. It never exits non-zero once its arguments parse; a
                # failed read leaves the field alone — the claim comment is
                # still the record.
                node scripts/ci/claim-collision.mjs --issue "$number" --claimant "$COMMENT_AUTHOR" --posted-on "$ON_ISSUE" --claimed-at "${COMMENT_CREATED_AT:-}" --apply </dev/null 2>&1 | tee -a collision.log \
                  || echo "  claim #$number not projected (skipped)"
                ;;
              release)
                if gh issue edit "$number" --repo "$REPO" --remove-assignee "$COMMENT_AUTHOR" </dev/null >/dev/null 2>&1; then
                  echo "  unassigned #$number from @$COMMENT_AUTHOR"
                  echo "- unassigned **#$number** from @$COMMENT_AUTHOR" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "  could not unassign #$number (skipped)"
                fi
                ;;
            esac
          done < actions.txt

          if [ -s collision.log ]; then
            # One line per claim, for the step summary. `|| true`: a log with
            # no JSON (a failed read) is the degraded path, not a red step.
            (grep -E '^\{' collision.log || true) | while read -r d; do
              echo "- claim: $(printf '%s' "$d" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write("#"+d.issue+" "+d.action+" — "+d.reason)')" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
