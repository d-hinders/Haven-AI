# Only allow PRs to main from `dev` (the integration branch) or a `hotfix/*`
# branch (emergency fixes that can't wait for the dev cycle). Acts as a gate
# since GitHub Free has no native branch-source restriction.
#
# Bootstrap note: this gate blocks any non-allowed source branch — including the
# PR that introduces it (a feature branch). That PR must be admin-merged once;
# afterwards the gate lives on `main` and applies to every later PR. For the gate
# to actually block merges, add this check ("gate") to main's required status
# checks in branch protection — a failing run alone is only advisory otherwise.
name: "Dev gate: only dev or hotfix/* → main"

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: "Check source branch"
        run: |
          SOURCE="${{ github.event.pull_request.head.ref }}"
          echo "Source branch: $SOURCE"
          if [[ "$SOURCE" != "dev" && "$SOURCE" != hotfix/* ]]; then
            echo "::error::Only 'dev' or a 'hotfix/*' branch may merge into 'main'. PR is from '$SOURCE'."
            exit 1
          fi
          echo "✅ Allowed: $SOURCE → main"

  # Money-flow QA freshness gate (#578, hardened in #1030). Rather than run the
  # money-moving harness inline on every promotion PR (which would burn testnet
  # funds per-attempt and need the QA_* secrets in this PR-triggered workflow),
  # require that a GREEN `qa-dev.yml` run already COVERS the money-path code
  # being promoted — produced by the nightly schedule, a manual dispatch, or
  # the post-deploy `deployment_status` run that #2273 fires from the Railway
  # deploy (admitted by SHA ancestry and the money-flow job's conclusion since
  # #2404). The harness itself stays out of the hot path.
  #
  # The logic lives in scripts/ci/qa-freshness.mjs, not inline here, because
  # this is what replaced the in-session money-path approval pause (#1024) and
  # untestable bash was how both of its original gaps went unnoticed: the check
  # was time-based rather than SHA-bound, and it was blind to `hotfix/*`
  # entirely. That file is pure + unit-tested; this job is just its IO.
  #
  # Escape hatch, deliberately kept: a `qa-override` PR label skips the check
  # (documented quarantine for a wedged testnet flake). It emits a ::warning::,
  # which is the point — a named, logged bypass is a feature.
  qa-freshness:
    runs-on: ubuntu-latest
    permissions:
      # contents: read is REQUIRED — the job checks out the repo to diff the QA
      # run's commit against the promotion head. Without it checkout fails, the
      # job fails, and the promotion is blocked. Fail-closed, but for the wrong
      # reason, so it would look like a real finding.
      contents: read
      actions: read
      pull-requests: read
    env:
      # A green money-flow run must be no older than this many hours. Override with a
      # repo variable if the dev cadence changes. Default 30h covers a missed nightly.
      # Explicit repo variable since #1066 (set to 30) — the promotion window
      # is a deliberate, reviewable number, not a fallback. The `|| '30'`
      # stays as a fail-safe against accidental variable deletion only.
      FRESHNESS_HOURS: ${{ vars.QA_FRESHNESS_HOURS || '30' }}
    steps:
      # fetch-depth: 0 — the gate diffs the QA run's commit against the
      # promotion head. On a shallow clone that diff fails, and the script
      # fails CLOSED rather than reading it as "nothing changed".
      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'qa-override') }}
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'qa-override') }}
        with:
          node-version-file: '.nvmrc'

      - name: "Require a money-flow QA run covering the promoted money-path code"
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'qa-override') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/qa-freshness.mjs

      - name: "Note qa-override bypass"
        if: ${{ contains(github.event.pull_request.labels.*.name, 'qa-override') }}
        run: echo "::warning::'qa-override' label present — skipping the money-flow freshness gate. Confirm a recent manual QA run before promoting."
