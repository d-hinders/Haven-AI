name: Docs staleness audit

# Phase 4 of the documentation-quality system (#646). Weekly: ranks docs whose
# covered code changed after their `last-verified` date and upserts the report
# into a single tracking issue — the standing "which doc is lying?" queue.
# Report-only: it never fails, and it opens ONE issue it keeps updating rather
# than spamming new ones.
#
# #4631: the same job also runs the quality-scan runner's doc-figure section
# (`scan-remeasure.mjs --doc-figures-only`) and appends it under the ranking.
# The run step has no `GH_TOKEN`, so it does not read the runner's standing
# issue; running the runner here keeps the figures at the same SHA as the
# ranking instead of six days behind it. A moved figure is refreshed in the doc
# (figures + `sha` in the row) or rewritten as a dated reading — never
# `last-verified` alone.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Docs staleness audit
    if: github.repository == 'd-hinders/Haven-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the audit counts commits since last-verified

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # A doc row's command may call ripgrep through `$RG`; a missing rg is a
      # broken-instrument zero, so the runner refuses those rows instead of
      # running them. Same install as scan-remeasure.yml.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # #4631: the doc-figure section, at the same SHA as the ranking below.
      - name: Re-measure the doc figures
        run: node scripts/docs/scan-remeasure.mjs --sha "$GITHUB_SHA" --doc-figures-only --out figures.txt

      - name: Run the audit
        id: audit
        run: |
          node scripts/docs/audit-staleness.mjs --top=15 --figures-report figures.txt > report.txt
          cat report.txt
          {
            echo 'report<<AUDIT_EOF'
            cat report.txt
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          TITLE='Docs staleness audit (weekly)'
          BODY="$(printf 'Automated weekly audit (#646). For each doc: re-verify it against the code and bump \`last-verified\`, or update it. For each moved doc figure: refresh the figure in the doc (figures + \`sha\` in its row in \`docs/quality/scan-baselines.json\`) or rewrite it as a dated reading — never \`last-verified\` alone.\\n\\n\`\`\`\\n%s\\n\`\`\`\\n\\n_Regenerated every Monday by docs-audit.yml — do not edit by hand._' "$REPORT")"
          # Bot-ownership upsert (#3341): select by AUTHOR — the one attribute a
          # human cannot set — plus an exact title, never `in:title`, which is a
          # tokenised search that adopted any human issue whose title merely
          # contained these words and overwrote its body. A failed lookup fails
          # the step instead of falling through to a duplicate create.
          printf '%s' "$BODY" | node scripts/ci/standing-issue-upsert.mjs \
            --title "$TITLE" \
            --author 'app/github-actions' \
            --list-args '--label documentation --state open --json' \
            --label documentation \
            --repo "$GITHUB_REPOSITORY"
