name: Docs quality

# Phase 1 of the documentation-quality system (epic #642).
# See docs/contributing/docs-quality-system.md.
#
# #1023: `docs:check` + `docs:test` used to be a hard gate ONLY inside
# /ship-next, which made the canonical workflow stricter than opening a PR by
# hand — the standard's enforcement depended on the tool. They run for everyone
# now, so add "Docs front-matter & agent skills" to dev's required checks.
#
# ## Two jobs, because one of them is a REQUIRED check
#
# The blocking validators and the advisory network checks (lychee, markdownlint,
# Vale) are separate jobs on purpose:
#
#   * `continue-on-error` protects against a step FAILING, not against the job
#     TIMING OUT. Sharing a job meant a slow lychee run over ~130 external URLs
#     could cancel the whole job — and a cancelled required check blocks
#     auto-merge just as hard as a failing one, despite "only front-matter
#     blocks" being the intent.
#   * The required check's NAME is what a reviewer reads. "Front-matter, links
#     & style" named three things while gating one.
#
# So `validate` is the required check (dependency-free, seconds, tight timeout)
# and `advisory` carries the network steps and never gates anything.
#
# Deliberately NO `paths:` filter on `pull_request`: a required check that is
# skipped never reports, and GitHub waits forever for a run that will not
# happen (the #933 lesson, recorded in docs-coupling.yml). Both validators are
# whole-repo and dependency-free, so running them unconditionally is cheap.
# The `push:` trigger keeps its filter — nothing is waiting on those runs.

on:
  push:
    branches: [main, dev]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.vale.ini'
      - '.lychee.toml'
      - '.markdownlint.json'
      - '.github/vale/**'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── BLOCKING. This is the required status check. ──
  validate:
    name: Docs front-matter & agent skills
    runs-on: ubuntu-latest
    # Both steps are local and dependency-free; they finish in seconds. A tight
    # bound means a hang fails fast and visibly instead of holding a PR.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # `docs:check` now includes the #1843 chain-integrity check, which
          # compares each changed doc's `last-verified` line against the merge
          # base. A shallow clone has no base commit to read, and the check
          # fails closed in CI rather than reporting a clean bill of health.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Every doc has valid front-matter, every `covers` glob resolves, no
      # changed doc dropped an entry from its `last-verified` chain, and
      # portable agent skills plus client adapters stay aligned.
      # Dependency-free, so no `npm ci` is needed.
      #
      # BASE_SHA/HEAD_SHA are set only for `pull_request`. On a `push` to
      # main/dev the chain check sees neither and skips loudly: there is no
      # base to compare against and nobody to act on a finding. Adding it to this job
      # rather than to a new one is deliberate: **Docs front-matter & agent
      # skills** is already a required check, so the rule is enforced the day
      # it merges instead of the day someone remembers to edit the ruleset
      # (the #933 shape, one step removed).
      - name: Validate docs and agent skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run docs:check

      # Unit tests for the documentation and agent-skill validators.
      - name: Test the docs validators
        if: always()
        run: node --test scripts/docs/*.test.mjs

  # ── ADVISORY. Reports findings; must never gate a merge. Do not add this job
  # to the required-checks ruleset. ──
  advisory:
    name: Docs links & style (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Link check (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

      - name: Markdown lint
        if: always()
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules

      - name: Terminology (Vale, product copy only)
        if: always()
        continue-on-error: true
        uses: errata-ai/vale-action@v2
        with:
          files: docs/product
          fail_on_error: false
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
