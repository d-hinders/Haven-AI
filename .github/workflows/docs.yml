name: Docs quality

# Phase 1 of the documentation-quality system (epic #642).
# See docs/contributing/docs-quality-system.md.
#
# #1023: `docs:check` + `docs:test` used to be a hard gate ONLY inside
# /ship-next, which made the canonical workflow stricter than opening a PR by
# hand — the standard's enforcement depended on the tool. They run for everyone
# now, so add "Docs front-matter & agent skills" to dev's required checks.
#
# ## Two jobs, because one of them is a REQUIRED check
#
# The blocking validators and the advisory network checks (lychee, markdownlint,
# Vale) are separate jobs on purpose:
#
#   * `continue-on-error` protects against a step FAILING, not against the job
#     TIMING OUT. Sharing a job meant a slow lychee run over ~130 external URLs
#     could cancel the whole job — and a cancelled required check blocks
#     auto-merge just as hard as a failing one, despite "only front-matter
#     blocks" being the intent.
#   * The required check's NAME is what a reviewer reads. "Front-matter, links
#     & style" named three things while gating one.
#
# So `validate` is the required check (dependency-free, seconds, tight timeout)
# and `advisory` carries the network steps and never gates anything.
#
# Deliberately NO `paths:` filter on `pull_request`: a required check that is
# skipped never reports, and GitHub waits forever for a run that will not
# happen (the #933 lesson, recorded in docs-coupling.yml). Both validators are
# whole-repo and dependency-free, so running them unconditionally is cheap.
# The `push:` trigger keeps its filter — nothing is waiting on those runs.
#
# ## `edited`, because one step's input is the pull request itself (#2839)
#
# The close-keyword guard reads the pull-request BODY and TITLE. Everything
# else here reads the repository, and every change to the repository arrives as
# `synchronize` — but a body or title is edited without a push, and `edited` is
# NOT in the default type list (`opened`, `synchronize`, `reopened`). So the
# guard could pass, the body could then be rewritten, and the merge would act
# on text no check had ever read. A green REQUIRED check describing text that
# no longer exists is worse than no check: #2819, an `operator-verify` issue,
# was closed exactly that way — the guard blocked the keyword in a commit
# message, and the same keyword went into the body afterwards while describing
# the fix.
#
# `advisory` opts OUT of `edited` instead of the trigger staying narrow,
# because its inputs are entirely in the repository: re-running lychee over
# ~130 external URLs because someone reworded a description is waste, and the
# job's whole reason for existing is that those network steps are slow. It is
# not a required check, so a skipped run reports as skipped and blocks nothing
# — the #933 hazard applies to `validate`, which is why `validate` does not
# opt out.

on:
  push:
    branches: [main, dev]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.vale.ini'
      - '.lychee.toml'
      - '.markdownlint.json'
      - '.github/vale/**'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    # `edited` is not a default type. It is here for the close-keyword guard —
    # see the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── BLOCKING. This is the required status check. ──
  validate:
    name: Docs front-matter & agent skills
    runs-on: ubuntu-latest
    # Least privilege, scoped to this job so the advisory job's Vale reporter is
    # unaffected. `issues: read` is what the close-keyword guard needs to see an
    # `operator-verify` label; `pull-requests: read` is how it reads the body.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    # Both steps are local and dependency-free; they finish in seconds. A tight
    # bound means a hang fails fast and visibly instead of holding a PR.
    timeout-minutes: 5

    steps:
      # A shallow clone is enough: the #1843 chain-integrity check that read
      # the merge base was retired by #2681, and none of the five `docs:check`
      # scripts reads git history (two call `git ls-files`, which reads the
      # index, not history).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Every doc has valid front-matter, every `covers` glob resolves, no doc
      # names a file its `covers:` cannot reach (#2679), portable agent skills
      # plus client adapters stay aligned, and — since #2657 — no live doc
      # sentence restates either UI merge-gate rule #2636 retired.
      # Dependency-free, so no `npm ci` is needed.
      #
      # #2657 hangs off `docs:check` rather than off a new workflow or a new
      # step, for the reason the two guards below already record: **Docs
      # front-matter & agent skills** is a required status check, so the rule
      # gates the day it merges instead of the day someone remembers to edit
      # the ruleset. `ui-gate-wording.mjs` is whole-repo and dependency-free
      # like its neighbours, and this job has no `paths:` filter on
      # `pull_request`, so it sees every PR.
      #
      # No step here reads a base commit any more: BASE_SHA/HEAD_SHA fed the
      # #1843 chain check, retired by #2681, and none of the five current
      # scripts consults them. Adding a rule to this job rather than to a new
      # one stays deliberate: **Docs front-matter & agent skills** is already a
      # required check, so the rule is enforced the day it merges instead of
      # the day someone remembers to edit the ruleset (the #933 shape, one
      # step removed).
      - name: Validate docs and agent skills
        run: npm run docs:check

      # Unit tests for the documentation and agent-skill validators.
      - name: Test the docs validators
        if: always()
        run: node --test scripts/docs/*.test.mjs

      # #2276: `Closes #<n>` is a GitHub keyword, so ship-next's operator-verify
      # mode ("the issue stays OPEN, a human still has to run the live step")
      # could only ever be prose — and it lost the first time it was used, on
      # the merge of PR #2272. The rule now has a mechanism.
      #
      # It lives on THIS job for the reason the step above gives: **Docs
      # front-matter & agent skills** is already a required status check, so the
      # rule is enforced the day it merges rather than the day someone remembers
      # to edit the ruleset. `Repo CI config checks` — where the rest of
      # scripts/ci/ runs — is NOT in the ruleset, so hosting it there would have
      # produced an advisory red X that auto-merge sails past.
      #
      # #2320 widened what it reads. GitHub honours the keyword in every commit
      # message that reaches the default branch and — via the squash subject — in
      # the title, not only in the body. The guard proved that on itself: PR #2314's
      # body closed only its own issue (#2276) and this step went green on it,
      # while a commit message narrating the original incident closed #2268 a
      # second time on the merge.
      # `gh pr view --json commits,title` covers those; the `pull-requests: read`
      # scope above is what reads them, so no permission change was needed.
      #
      # `if: always()` so a red front-matter check does not hide this one, and
      # pull-request-only: there is no body to read on a push to dev/main.
      # The self-test also runs under the `scripts/ci/*.test.mjs` glob; it is
      # repeated here because a guard whose self-test only runs in a non-required
      # job can start passing vacuously without anything blocking.
      - name: Operator-verify close-keyword guard
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/ci/operator-verify-close-guard.test.mjs
          node scripts/ci/operator-verify-close-guard.mjs --pr "${{ github.event.pull_request.number }}"

  # ── ADVISORY. Reports findings; must never gate a merge. Do not add this job
  # to the required-checks ruleset. ──
  advisory:
    name: Docs links & style (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing here reads the pull request itself, so a reworded description
    # cannot change any verdict below. Skipping keeps ~130 external URL checks
    # off every description tweak. Safe to skip precisely because this job is
    # advisory — see the `edited` note in the header.
    #
    # It can DELETE one, though, and that is worth knowing: this workflow's
    # concurrency group is shared with `cancel-in-progress: true`, so editing a
    # description while a `synchronize` run is in flight cancels it, and the
    # replacement run skips this job. The lychee/markdownlint/Vale verdict for
    # that commit is then gone until the next push, and Vale's
    # `github-pr-check` annotations go stale rather than refreshing. Advisory
    # output, so nothing is blocked — but "cannot change any verdict" is a
    # claim about content, not about existence.
    #
    # Written as a deny-list of one on purpose: `types:` above could gain a
    # member tomorrow, and this job should run for it without being edited.
    if: github.event.action != 'edited'

    steps:
      - uses: actions/checkout@v4

      - name: Link check (lychee)
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

      - name: Markdown lint
        if: always()
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules

      - name: Terminology (Vale, product copy only)
        if: always()
        continue-on-error: true
        uses: errata-ai/vale-action@v2
        with:
          files: docs/product
          fail_on_error: false
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
