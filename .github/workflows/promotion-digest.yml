name: Pending promotion digest

# With `dev` as the default branch, feature issues close on dev-merge
# (implementation done). This digest is how we track what still needs a
# dev → main promotion: it keeps a single always-current "📦 Pending promotion"
# issue listing the commits on dev that aren't in prod (main) yet.
# See docs/contributing/autonomous-pr-loop.md.

on:
  push:
    branches: [main]       # a promotion just landed — the digest is now stale in
                           # the worst direction (claims commits pending that shipped)
  schedule:
    - cron: '13 8 * * 1'   # Mondays 08:13 UTC — catches drift accumulating on dev
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: promotion-digest
  cancel-in-progress: true

jobs:
  digest:
    name: Report dev-not-in-prod
    if: github.repository == 'd-hinders/Haven-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and upsert the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main dev

          count=$(git rev-list --count --first-parent origin/main..origin/dev)
          list=$(git log --first-parent --pretty='- %s' origin/main..origin/dev)
          ts=$(date -u +%FT%TZ)

          # #2767: the two inflow figures the filing bar is steered by, printed into the
          # digest with the commands that produce them. Advisory: a gh hiccup must not
          # fail the digest — the pending-promotion tracker is the load-bearing half.
          W_START=$(date -u -d '7 days ago' +%Y-%m-%d)
          FILED_N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 500 \
            --search "created:>=$W_START" --json number --jq 'length' 2>/dev/null || echo '')
          CLOSED_N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state closed --limit 500 \
            --search "closed:>=$W_START" --json number --jq 'length' 2>/dev/null || echo '')
          MERGED_N=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base dev --limit 500 \
            --search "merged:>=$W_START" --json number --jq 'length' 2>/dev/null || echo '')
          PRODUCT_N=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base dev --limit 500 \
            --search "merged:>=$W_START" --json title \
            --jq '[.[] | select(.title | test("^(fix|feat|perf)\\b")) | select(.title | test("^(fix|feat|perf)\\((ci|qa|docs|doc|deps|build|release|tooling|lint|scripts|hooks|style|chore|test)\\)") | not)] | length' 2>/dev/null || echo '')

          if [ "$count" -eq 0 ]; then
            body=$(printf '%s\n' \
              '✅ **dev and main are in sync** — nothing awaiting promotion.' \
              '' \
              "_Updated ${ts} by the promotion-digest workflow._")
          else
            body=$(printf '%s\n' \
              "**${count} commit(s) on \`dev\` not yet in prod (\`main\`).** Promote with a \`dev → main\` PR." \
              '' \
              "${list}" \
              '' \
              "_Updated ${ts} by the promotion-digest workflow._")
          fi

          # Append the metrics block only when every figure computed; an empty from a
          # `|| echo ''` fallback means the API blipped, and the section is skipped
          # whole rather than printed half-wrong. Each row carries its own command.
          if [ -n "$FILED_N" ] && [ -n "$CLOSED_N" ] && [ -n "$MERGED_N" ] && [ -n "$PRODUCT_N" ]; then
            metrics=$(printf '%s\n' \
              '' \
              '## Filing-bar metrics (#2767)' \
              '' \
              'Issue inflow per issue closed, and product share of merges — the two' \
              "figures the filing bar is steered by, over the last 7 days (\`--search\` window from ${W_START})." \
              '' \
              '| Figure | Value | Window |' \
              '|---|---|---|' \
              "| Issues filed per issue closed | ${FILED_N} / ${CLOSED_N} | created:>${W_START} / closed:>${W_START} |" \
              "| Product PRs as a share of merges | ${PRODUCT_N} / ${MERGED_N} | merged:>${W_START}, base dev; product = conventional \`fix\`/\`feat\`/\`perf\` outside a tooling scope |" \
              '' \
              '_Baselines (2026-09-08): ~1.0 and 36 %. Targets: under 0.3 and above 60 %._' \
              '' \
              '_Commands (from the repo root; the source of each number above):_' \
              '' \
              '```bash' \
              "gh issue list --repo ${GITHUB_REPOSITORY} --state all --limit 500 --search \"created:>=${W_START}\" --json number --jq length" \
              "gh issue list --repo ${GITHUB_REPOSITORY} --state closed --limit 500 --search \"closed:>=${W_START}\" --json number --jq length" \
              "gh pr list --repo ${GITHUB_REPOSITORY} --state merged --base dev --limit 500 --search \"merged:>=${W_START}\" --json number --jq length" \
              "gh pr list --repo ${GITHUB_REPOSITORY} --state merged --base dev --limit 500 --search \"merged:>=${W_START}\" --json title --jq '[.[] | select(.title | test(\"^(fix|feat|perf)\\b\")) | select(.title | test(\"^(fix|feat|perf)\\((ci|qa|docs|doc|deps|build|release|tooling|lint|scripts|hooks|style|chore|test)\\)\") | not)] | length'" \
              '```')
            body=$(printf '%s\n%s\n' "$body" "$metrics")
          fi

          # Self-heal the label so the workflow works even before labels.yml syncs.
          gh label create promotion --color 1d76db --description "Tracks dev → prod promotion" --force >/dev/null 2>&1 || true

          num=$(gh issue list --label promotion --state open --json number --jq '.[0].number' || true)
          if [ -n "${num:-}" ] && [ "$num" != "null" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "📦 Pending promotion: dev → main" --label promotion --body "$body"
          fi
