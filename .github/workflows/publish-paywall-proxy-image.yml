name: Publish paywall proxy image

# The merchant kit's paywall proxy as a container image (#5007), built and
# pushed by CI to GitHub's container registry. Never pushed by hand, and there
# is no npm publish here: the kit stays `"private": true`.
#
# WHY THIS IS NOT IN publish.yml. That file's `paths:` names only the five npm
# packages, and widening it would cut `0.0.0-dev.*` snapshots of all five on
# every kit push to `dev`; `publish-tag-promotion.test.mjs` and the release
# scripts also parse it. So the image gets its own workflow, and publish.yml is
# unchanged.
#
# THE TAG RULE, and where the guard sits. The repository's publishing invariant
# is that dev-branch code reaches only a `dev` channel (`publish.yml:37`,
# `:264-265`). The image follows it:
#
#   push to `dev`  → `dev-<short-sha>` and moves `dev`
#   push to `main` → `pilot-<short-sha>` and moves `pilot`
#   never          → `latest`, because a `latest` would read as a general
#                    release, which decisions (b) and (c) on #5005 say this is
#                    not
#
# `packages: write` lets any run of this workflow push any tag, so the rule that
# `dev` never moves `pilot` cannot rest on the token. It rests on two things:
#
#   1. STRUCTURE — the `pilot` push lives in its own job gated
#      `if: github.ref == 'refs/heads/main'`, and every job carries
#      `if: github.repository == 'd-hinders/Haven-AI'`.
#   2. A REFUSAL in the tag computation — `scripts/ci/paywall-proxy-image-tags.mjs`
#      refuses a channel/tag pair the rule does not allow, as publish.yml's
#      `assert_publish_allowed` refuses a bad channel/tag pair. Its test is
#      `scripts/ci/paywall-proxy-image-tags.test.mjs`, and reverting the refusal
#      turns that test red.
#
# That is a script check, not a credential boundary, and the PR says so.
#
# VISIBILITY. The package is public (owner decision 2026-11-20), so a merchant
# needs no `docker login`. A new package on a personal account starts private;
# the `d-hinders` account makes it public once, after the first push, in the
# package's settings. That is the operator step on the epic's checklist.
#
# ONE PROCESS PER STORE. The image's `/data` volume holds `PAYMENTS_DB`, which
# the proxy locks exclusively. One container per volume; stop the old container
# before starting the new one; never scale above one replica on a volume.

on:
  push:
    branches: [dev, main]
    paths:
      - 'packages/paywall-proxy/**'
      - 'packages/merchant-payments/**'
      - 'packages/sdk/**'
      - 'package-lock.json'
      - '.github/workflows/publish-paywall-proxy-image.yml'

# Per-ref, so a stream of dev builds cannot sit in front of a promotion. The
# moving tag is the reason: two runs on one ref must not race to move it.
concurrency:
  group: publish-paywall-proxy-image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  dev:
    name: Publish the dev image
    # Never run from a fork, and never from a ref that is not `dev`.
    if: github.repository == 'd-hinders/Haven-AI' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compute the image tags
        id: tags
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        # The refusal lives in the script, not here: a channel/tag pair the rule
        # does not allow exits non-zero and the job stops before any push.
        run: |
          set -euo pipefail
          tags="$(node scripts/ci/paywall-proxy-image-tags.mjs --ref "$REF" --sha "$SHA")"
          echo "Publishing:"
          echo "$tags"
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/paywall-proxy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  pilot:
    name: Publish the pilot image
    # The `dev → main` promotion is the ONLY thing that moves `pilot`. This gate
    # is half the guard; the tag computation's refusal is the other half.
    if: github.repository == 'd-hinders/Haven-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compute the image tags
        id: tags
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags="$(node scripts/ci/paywall-proxy-image-tags.mjs --ref "$REF" --sha "$SHA")"
          echo "Publishing:"
          echo "$tags"
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/paywall-proxy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
