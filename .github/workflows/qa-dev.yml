name: QA — money-flow (dev)

# Deterministic money-flow harness against the shared dev backend using the QA_*
# secrets. Testnet-only (Base Sepolia); never touches mainnet.
#
# Triggers (#578, post-deploy half rebuilt by #2273):
#   - workflow_dispatch: manual run / local-debug parity.
#   - schedule: nightly, so a fresh green signal exists without anyone triggering it.
#   - deployment_status: fired by GitHub itself when the Railway GitHub integration
#     marks a Deployment of the dev backend `success`, so QA runs against exactly
#     what just shipped, at the SHA that shipped (GITHUB_SHA is the deployed
#     commit for this event — docs: "Commit to be deployed").
#
#     This REPLACES the `repository_dispatch: [dev-deployed]` trigger that #2268
#     found had never fired once (0 of 156 runs, 2026-06-30 → 2026-08-31). That
#     design needed the deploy provider to run an authenticated curl AFTER the
#     deploy, and the owner established on the Railway dashboard (#2268,
#     2026-08-31 and 2026-09-01) that Railway offers no such thing: project
#     webhooks are URL-only (no Authorization header), and the only service hook
#     is a PRE-deploy step, which would have tested the previous deployment.
#     Railway DOES create real GitHub Deployments though — `railway-app[bot]`,
#     environment `Haven AI / dev`, statuses in_progress → success → inactive —
#     measured with `gh api repos/d-hinders/Haven-AI/deployments` on 2026-09-02
#     (28 of the newest 100 deployments; 2 more are `Haven AI / production`,
#     which is why the environment filter below is not optional).
#
#     Two properties of that event stream shape the `gate` job:
#       1. EVERY dev deployment emits `success` TWICE (sometimes three times):
#          once when it goes live, and again the moment the NEXT deployment
#          starts building — Railway re-states "N is still the live one" — then
#          `inactive` once N+1 is live (`inactive` never triggers a run). A naive
#          trigger runs the money-moving harness twice per deploy, and with
#          `cancel-in-progress: false` the duplicates QUEUE. The gate asks the
#          Deployments API whether this deployment is still the NEWEST one for
#          the environment and skips the harness when it is not.
#       2. `in_progress` statuses trigger runs too. Those are skipped by the
#          same gate in seconds, before `npm ci`, and never enter the money
#          concurrency group (which is why concurrency moved from the workflow
#          to the money-flow JOB — a skipped run must not hold the group).
#
#     Provenance (#2271). A `deployment_status` run carries GitHub-authored
#     evidence a curl cannot forge: the deployment's creator is the Railway
#     GitHub App (`railway-app[bot]`), which only Railway's installation token
#     can produce. The gate refuses any other creator, the failure issue below
#     records deployment id + creator + SHA next to the trigger, and
#     scripts/ci/guard-freshness.mjs counts a run as "the post-deploy trigger
#     fired" only when a Railway-created deployment of that run's exact SHA
#     exists AND the money-flow JOB concluded success — a run the gate refused
#     has run-level conclusion `success` with the job skipped, so the run-level
#     field alone would count the two or three decoys every deploy leaves. So a
#     manual `workflow_dispatch`, a Deployment a human creates by hand through
#     the API, or a gate-skipped decoy can no longer mute the freshness alarm.
#
#     Do NOT "fix" any of this by adding a push trigger: this is a black-box
#     harness against the DEPLOYED backend, so firing on push races the deploy
#     and produces a green run whose headSha claims coverage the deployed code
#     never had — a visible block converted into a false pass.
#
#     UNVERIFIED UNTIL OBSERVED: `deployment_status`, like `repository_dispatch`,
#     only runs the DEFAULT branch's workflow file, so this trigger cannot be
#     seen firing from a pull request. The first real run after merge is the
#     evidence; until then #2268 / #2273 stay open in operator-verify mode.
#
# This run is the promotion signal that dev-gate.yml's freshness gate reads before
# allowing dev → main. On failure it files (or comments on) a `qa-failure` issue.
on:
  workflow_dispatch:
    inputs:
      haven_api_url:
        description: Override the dev backend URL (defaults to the QA_HAVEN_API_URL secret)
        required: false
        type: string
  schedule:
    # 03:17 UTC nightly. Odd minute to dodge the top-of-hour Actions scheduling surge.
    - cron: '17 3 * * *'
  # No `types:` filter exists for this event — every status (in_progress,
  # success, failure, error) starts a run; `inactive` does not. The `gate` job
  # is the filter.
  deployment_status:

# Make the post-deploy runs legible in `gh run list` / the Actions UI: the
# deployed SHA, the environment and the status that fired it. Manual and
# scheduled runs keep the workflow name as their title.
run-name: ${{ github.event_name == 'deployment_status' && format('post-deploy {0} → {1} ({2})', github.event.deployment.sha, github.event.deployment.environment, github.event.deployment_status.state) || 'QA — money-flow (dev)' }}

permissions:
  contents: read
  issues: write
  # The gate job reads the Deployments API to de-duplicate Railway's repeated
  # `success` statuses (#2273). Read-only; the default token cannot create or
  # update a deployment with it.
  deployments: read

jobs:
  # Decides whether this run should move money at all. Cheap (no npm ci) and
  # deliberately OUTSIDE the `qa-dev-money-flow` concurrency group, so a
  # duplicate or in-progress status is dropped here in seconds rather than
  # queued behind a live money-moving run (#2273).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this event should run the money-flow harness
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENV: ${{ github.event.deployment.environment }}
          DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}
          STATUS_STATE: ${{ github.event.deployment_status.state }}
          # Both constants are pinned to scripts/ci/guard-freshness.mjs by
          # scripts/ci/guard-freshness.test.mjs, so the workflow's filter and the
          # freshness guard's provenance check cannot drift apart silently. The
          # environment string is Railway-side and not controlled by this repo:
          # if Railway renames it, this gate skips every run and the freshness
          # guard goes red within its 4-day budget — which is the alarm working.
          RAILWAY_DEV_ENVIRONMENT: 'Haven AI / dev'
          RAILWAY_DEPLOY_CREATOR: 'railway-app[bot]'
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "deployment_status" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT_NAME run — the harness runs unconditionally for this event."
            exit 0
          fi
          skip() {
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping money-flow: $1 (deployment $DEPLOYMENT_ID, sha $DEPLOYMENT_SHA, env '$DEPLOYMENT_ENV', creator '$DEPLOYMENT_CREATOR', state '$STATUS_STATE')"
            exit 0
          }
          [ "$STATUS_STATE" = "success" ] || skip "status state is not success"
          [ "$DEPLOYMENT_ENV" = "$RAILWAY_DEV_ENVIRONMENT" ] || skip "not the dev backend environment"
          [ "$DEPLOYMENT_CREATOR" = "$RAILWAY_DEPLOY_CREATOR" ] || skip "deployment was not created by the Railway GitHub App"
          # De-duplicate Railway's re-stated `success` (see the header): only the
          # NEWEST deployment for the environment gets a run. When N's second
          # `success` arrives, N+1 already exists (it is what caused the
          # re-statement), so N is no longer newest and is dropped.
          NEWEST=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/deployments" \
            -f environment="$RAILWAY_DEV_ENVIRONMENT" -F per_page=1 --jq '.[0].id // empty')
          [ -n "$NEWEST" ] || { echo "::error::could not read the newest deployment from the Deployments API"; exit 1; }
          [ "$NEWEST" = "$DEPLOYMENT_ID" ] || skip "superseded — newest deployment for the environment is $NEWEST"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "::notice::post-deploy run: Railway deployment $DEPLOYMENT_ID of $DEPLOYMENT_SHA to '$DEPLOYMENT_ENV' is live and newest."

  money-flow:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The harness moves shared testnet funds on one QA delegate/allowance — never
    # run two at once, and let an in-flight money-moving run finish rather than
    # cancelling it. Job-level (not workflow-level) since #2273 so that a run the
    # gate skips never occupies the group.
    concurrency:
      group: qa-dev-money-flow
      cancel-in-progress: false
    steps:
      # #1047: the dispatch override points the harness — WITH the QA payment
      # secrets in env — at an arbitrary backend. Constrain it to Haven's own
      # deploy surface (a Railway origin) and put the actor + URL in the log,
      # so a dispatch can never quietly hand the QA credentials to an
      # attacker-controlled endpoint.
      - name: Validate haven_api_url override
        if: github.event.inputs.haven_api_url != ''
        env:
          OVERRIDE_URL: ${{ github.event.inputs.haven_api_url }}
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          # Whole-string [[ =~ ]] — NOT grep, which matches per line and lets
          # a crafted multi-line input (API dispatches can carry \n) pass on
          # one matching line while fetch()'s URL parser strips the newline
          # and sends the secrets elsewhere (review catch on #1117).
          if [[ "$OVERRIDE_URL" == *[![:print:]]* ]]; then
            echo "::error::haven_api_url override contains control characters — rejected (#1047)."
            exit 1
          fi
          if [[ ! "$OVERRIDE_URL" =~ ^https://[a-z0-9-]+\.up\.railway\.app/?$ ]]; then
            echo "::error::haven_api_url override must be an https://<app>.up.railway.app origin (#1047)."
            exit 1
          fi
          # Log AFTER validation — an unvalidated echo is a workflow-command
          # injection surface via embedded ::-directives.
          echo "::notice::qa-dev dispatched with haven_api_url override '$OVERRIDE_URL' by $DISPATCH_ACTOR"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build SDK dependency
        run: npm run build -w packages/sdk
      # #1154: the hosted-MCP leg runs the REAL @haven_ai/signer in-process, and
      # a workspace dep resolves to `packages/signer/dist` — which does not
      # exist until it is built. Without this step that leg dies on an import
      # error, which under the blocking completeness gate below is a red run
      # with a cause that has nothing to do with the money path.
      - name: Build edge signer dependency
        run: npm run build -w packages/signer
      - name: Run money-flow QA (bounded flake-retry)
        env:
          QA_HAVEN_API_URL: ${{ github.event.inputs.haven_api_url || secrets.QA_HAVEN_API_URL }}
          QA_PAYMENT_TO: ${{ secrets.QA_PAYMENT_TO }}
          # Delegation-rail QA identity (#1063): open-budget Hybrid treasury on
          # Base Sepolia. Without BOTH of these the two delegation legs skip.
          QA_DELEGATION_AGENT_API_KEY: ${{ secrets.QA_DELEGATION_AGENT_API_KEY }}
          QA_DELEGATION_DELEGATE_PRIVATE_KEY: ${{ secrets.QA_DELEGATION_DELEGATE_PRIVATE_KEY }}
          QA_DEMO_MERCHANT_URL: ${{ secrets.QA_DEMO_MERCHANT_URL }}
          # Hosted-MCP topology (#1154). Neither value is a secret — one is a
          # public endpoint, the other a public address — so they are read from
          # repo VARIABLES first (visible in the run log, which makes a
          # misconfiguration diagnosable) and fall back to secrets for operators
          # who filed them alongside the rest of the QA_* credentials. Missing
          # either one skips the leg, and the completeness gate below turns that
          # skip into a red run.
          QA_HOSTED_MCP_URL: ${{ vars.QA_HOSTED_MCP_URL || secrets.QA_HOSTED_MCP_URL }}
          QA_X402_BINDING_SIGNER: ${{ vars.QA_X402_BINDING_SIGNER || secrets.QA_X402_BINDING_SIGNER }}
          # Flake budget (#578): the harness is idempotent-safe to re-run, so a transient
          # testnet RPC hiccup gets one more shot before the run is called red. Bump via a
          # repo variable if a chain is flaky; keep low — each attempt consumes test funds.
          QA_MAX_ATTEMPTS: ${{ vars.QA_MAX_ATTEMPTS || '2' }}
          # #1044: once every leg's identity is provisioned, set the repo
          # variable QA_REQUIRE_ALL_LEGS=1 -- from then on a skipped leg fails
          # the run instead of reading as coverage.
          QA_REQUIRE_ALL_LEGS: ${{ vars.QA_REQUIRE_ALL_LEGS || '' }}
        run: |
          set -o pipefail
          attempts="${QA_MAX_ATTEMPTS:-2}"
          for i in $(seq 1 "$attempts"); do
            echo "::group::money-flow attempt $i/$attempts"
            if npm run qa:dev -w packages/qa-agent 2>&1 | tee qa-run.log; then
              echo "::endgroup::"
              echo "money-flow QA passed on attempt $i/$attempts"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::money-flow QA attempt $i/$attempts failed"
            if [ "$i" -lt "$attempts" ]; then sleep 30; fi
          done
          echo "::error::money-flow QA failed after $attempts attempt(s)"
          exit 1
      # #1044: a green run that SKIPPED legs is partial coverage, and the
      # dev->main promotion gate keys on this run's conclusion. This step turns
      # the run.ts skip marker into a step-level FAILURE. Blocking since #1066:
      # every leg is provisioned (#1063 closed the last legitimate skip), so a
      # skip now means a broken credential or a drained identity -- red is the
      # honest color. To retire a leg for real, delete its scenario in the same
      # PR that removes the need for it (see agent-qa.md), never re-loosen this.
      - name: Coverage completeness
        if: success()
        run: |
          if grep -q "green-with-skips:" qa-run.log; then
            echo "::error::money-flow QA SKIPPED legs -- coverage is partial, and every leg is expected to run (#1066):"
            grep -A10 "green-with-skips:" qa-run.log | sed -n "2,11p"
            exit 1
          fi
          echo "all legs executed -- full coverage"
      - name: File (or update) a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENV: ${{ github.event.deployment.environment }}
          DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # #2271: the trigger line must let a reader tell a real post-deploy run
          # from a hand-started one. A deployment_status run names the Railway
          # deployment (id, creator, deployed SHA) — GitHub-authored provenance a
          # curl cannot produce; a workflow_dispatch names the actor who started it.
          case "$GITHUB_EVENT_NAME" in
            deployment_status)
              TRIGGER="deployment_status — Railway deployment ${DEPLOYMENT_ID} of ${DEPLOYMENT_SHA} to '${DEPLOYMENT_ENV}', created by ${DEPLOYMENT_CREATOR}" ;;
            workflow_dispatch)
              TRIGGER="workflow_dispatch — started by ${GITHUB_ACTOR}" ;;
            *)
              TRIGGER="${GITHUB_EVENT_NAME}" ;;
          esac
          # Ensure the label exists (labels.yml owns only the surface taxonomy).
          gh label create qa-failure --color b60205 \
            --description "Automated: a scheduled/post-deploy money-flow QA run failed" 2>/dev/null || true
          BODY=$(printf '%s\n' \
            "The deterministic money-flow QA run (\`qa-dev.yml\`) failed." \
            "" \
            "- **Trigger:** \`${TRIGGER}\`" \
            "- **Run:** ${RUN_URL}" \
            "- **When:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "" \
            "This blocks the dev → main freshness gate (#578) until a green run exists." \
            "Open the run to see which scenario failed, then follow the triage steps in" \
            "\`docs/operations/agent-qa.md\` → Troubleshooting. A transient testnet/RPC" \
            "flake can be cleared by re-dispatching the workflow; a real regression should" \
            "get its own bug report under \`docs/bug-reports/\`.")
          EXISTING=$(gh issue list --label qa-failure --state open --limit 1 --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Another \`qa-dev\` failure (trigger: \`${TRIGGER}\`) — ${RUN_URL}"
            echo "Commented on existing qa-failure issue #${EXISTING}"
          else
            gh issue create --label qa-failure \
              --title "qa-dev money-flow failed ($(date -u '+%Y-%m-%d'))" \
              --body "$BODY"
          fi
