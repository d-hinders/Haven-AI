# Regenerate the /design-system visual baselines (#897) on a branch.
#
# Baselines MUST be Linux-rendered (CI is the judge; macOS fonts differ), so
# intended visual changes are accepted by dispatching this workflow on the PR
# branch: it rebuilds, reruns the visual specs with --update-snapshots, and
# commits the new baselines back to the branch — where they show up as a
# reviewable image diff in the PR. This is also how the very first baseline
# set was bootstrapped.
#
# Just dispatch it. The defaults are the safe ones and the ordinary case needs
# no inputs at all — see the `mode` input below for the one case that does.
#
# DIAGNOSE A FAILING DIFF BEFORE DISPATCHING THIS, in either mode: scan the diff
# PNG by row (a clean horizontal cut or a size-mismatch line is a height change;
# a continuous colour difference at unchanged dimensions is drift). Regenerating
# first is how a broken render becomes the expected state.
name: Update visual baselines

on:
  workflow_dispatch:
    inputs:
      # #2218. This was a hardcoded `all`, and `all` is why a dispatch aimed at
      # one baseline could silently re-bless others.
      #
      # In the installed Playwright (1.60.0), the two values are not variations
      # on a theme — they take different code paths in
      # `playwright/lib/matchers/expect.js`:
      #
      #   changed  the baseline is passed in as `expected`, the comparison runs
      #            WITH the spec's `threshold` / `maxDiffPixels`, and the file is
      #            rewritten only when that comparison FAILS.
      #   all      `expected: undefined` is passed instead, so no comparison
      #            happens at all, and the file is rewritten whenever the bytes
      #            differ.
      #
      # (A bare `--update-snapshots` with no value means `changed` — the flag's
      # `preset` in `playwright/lib/program.js`. Running with no flag at all
      # means `missing`.)
      #
      # Measured cost of `all` being the default, on PR #2217: a dispatch that
      # regenerated one deliberately-changed baseline also rewrote
      # `unmanaged-delegate-card-desktop.png` — max channel delta 1, a one-pixel
      # column at x=0, 180 px of 266,448, its test passing, its fixture seeding
      # `agents: []` so the changed component never rendered in it. Caught only
      # because a human diffed all 22 blob hashes; reverted in `02e3b719`.
      #
      # `all` is kept, because #1760 needs it: `changed` re-applies the gate's
      # tolerance, so drift that sits UNDER budget is not merely un-failed but
      # un-refreshable — that is the mechanical reason #1760's 2,084-pixel stale
      # TopBar band survived every regeneration anyone dispatched, each of which
      # reported "Baselines unchanged — nothing to commit." The gate's tolerance
      # decides what FAILS; it must not permanently decide what can be REFRESHED.
      #
      # So the unsafe mode stays reachable and stops being the default, and the
      # audit step below watches it.
      mode:
        description: 'changed = rewrite only baselines that FAIL comparison (default). all = rewrite on any byte difference; needs `expected`, and blesses renders nobody compared.'
        type: choice
        default: changed
        options: [changed, all]
      expected:
        description: 'Baselines you expect to move, comma/newline separated (names or paths). Optional under `changed`; REQUIRED under `all`, where `*` means "accept a full refresh".'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  # #1777: the follow-up step posts the deadlock notice ON THE PULL REQUEST.
  # That is the whole fix — see scripts/ci/baseline-push-followup.mjs.
  pull-requests: write

jobs:
  update:
    name: Regenerate /design-system baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # A GITHUB_TOKEN push is attributed to github-actions[bot], and a bot
      # push onto a branch with an OPEN PR strands it (#1777/#1850).
      #
      # The precise mechanism, because the imprecise version sends you looking
      # for the wrong repair. This used to say the push "does NOT trigger
      # pull_request workflows". It does trigger them — GitHub then PARKS the
      # runs at `conclusion: action_required`, pending approval, because a bot
      # pushed. No job executes, so no check run ever attaches to the SHA, and
      # the PR sits at "Expected — waiting for status" with nothing to wait
      # for. Verified on bot commit 31003514: check-runs total_count 0, while
      # actions/runs?head_sha=... showed 5 parked pull_request runs. "The event
      # never fired" would invite adding a `push` trigger, which does nothing.
      #
      # A PAT/app token in BASELINE_PUSH_TOKEN attributes the push to a real
      # actor, so no approval gate applies. Without it we fall back to
      # GITHUB_TOKEN and the follow-up step below says so ON THE PR.
      #
      # Note the fallback cannot be "fixed" by having this workflow push a
      # second, empty commit: the gate keys on WHO pushed, not on what was
      # pushed, so the second push parks exactly like the first.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.BASELINE_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (standalone)
        run: npm run build -w packages/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # #1609: apt-get only on cache miss — see ci.yml for the rationale.
      # Same cache key as the visual-regression job on purpose: baselines and
      # comparisons must render with the SAME cached browser build.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      # The mode is the dispatch input, defaulting to `changed`. The full
      # comparison of the two values, and why `all` survives at all, is on the
      # `mode` input at the top of this file — it belongs where the person
      # choosing it is looking, not here.
      #
      # `--update-snapshots=` is deliberately written with an explicit value
      # rather than as a bare flag: a bare `--update-snapshots` resolves to
      # `changed` today by way of the flag's `preset`, which is a Playwright
      # implementation detail this workflow should not be betting on.
      #
      # The input reaches the shell through `env:` and a quoted variable, never
      # through `${{ }}` interpolated into the `run:` body. `type: choice` is a
      # UI convenience — the dispatch API does not enforce the option list —
      # so an interpolated `mode` would be an arbitrary caller-supplied string
      # pasted into a shell command. Playwright then rejects anything outside
      # its own `choices`, so a bogus value fails the step instead of running.
      - name: Regenerate baselines
        run: npm run test:visual -w packages/frontend -- --update-snapshots="$UPDATE_MODE"
        env:
          UPDATE_MODE: ${{ inputs.mode }}
          CI: 1
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
          NEXT_TELEMETRY_DISABLED: 1

      # #2218. Runs BEFORE the commit, so a baseline this dispatch did not come
      # for is never pushed in the first place.
      #
      # It always emits the blob-hash delta of every baseline that moved — the
      # audit that caught #2217, now performed by the workflow instead of by
      # whoever remembered. It fails the run only when the dispatcher declared an
      # `expected` set and something outside it moved, or when `all` was chosen
      # with nothing declared. The default one-dispatch path stays green with no
      # inputs; a guard that fires on every dispatch gets routed around, and
      # routing around this one means `--update-snapshots` on a laptop, which is
      # worse than where we started. Rationale and tests: scripts/ci/baseline-audit.mjs
      # and its `node --test` sibling (run by ci.yml).
      - name: Audit which baselines moved
        id: audit
        env:
          UPDATE_MODE: ${{ inputs.mode }}
          EXPECTED_BASELINES: ${{ inputs.expected }}
        run: node scripts/ci/baseline-audit.mjs

      - name: Commit baselines to the branch
        id: commit
        env:
          AUDIT_TRAILER: ${{ steps.audit.outputs.trailer }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/frontend/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            # The audit's one-line delta rides in the commit message, so the
            # answer to "which baselines did this dispatch move, and from which
            # blobs" outlives the run's log-retention window.
            git commit -m "chore: regenerate /design-system visual baselines (Linux-rendered)" -m "$AUDIT_TRAILER"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # #1777. The step above used to end with a `::warning::` naming both
      # remedies. It was accurate enough and it still cost four sessions a step
      # each, plus twice more during #1857 — because a `::warning::` in a log
      # nobody reads, while a PR sits at "waiting for status", is not a control.
      #
      # So the condition is reported where the person is actually looking (a
      # sticky comment on the PR) and the run goes RED. A green run that leaves
      # the PR unmergeable is the least useful of the three possible outcomes.
      # The red does NOT mean the baselines are bad: they are committed and
      # pushed by the step above, before this one runs.
      #
      # The decision itself is a tested pure function rather than inline bash —
      # inline YAML only proves itself in production, which is precisely how the
      # old warning survived being useless. `node --test scripts/ci/*.test.mjs`
      # in ci.yml already covers it.
      #
      # Only the BOOLEAN `secrets.BASELINE_PUSH_TOKEN != ''` crosses into the
      # script. The secret's value is never passed, printed, or committed.
      - name: Report the push-attribution deadlock on the PR
        # Deliberately NOT `always()`: the only thing that can precede this and
        # still leave a push behind is the commit step itself, and `committed`
        # is unset unless that step reached the push. Running after an unrelated
        # earlier failure would add a second, misleading red.
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PUSH_TOKEN: ${{ secrets.BASELINE_PUSH_TOKEN != '' }}
          BASELINES_COMMITTED: ${{ steps.commit.outputs.committed }}
          PUSHED_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/ci/baseline-push-followup.mjs
